name: Teste Único de Notificação para Cristiano

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/teste-notificacao-cristiano.yml'

jobs:
  enviar-teste:
    name: Enviar teste somente ao Cristiano
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install firebase-admin
      - name: Enviar notificação de teste
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_USERNAME: cristiano
        run: node scripts/enviar-notificacoes.js
