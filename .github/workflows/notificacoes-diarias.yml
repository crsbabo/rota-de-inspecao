name: Notificações Diárias de Inspeção

on:
  schedule:
    # Tentativas redundantes próximas de 07:35 BRT. O script usa um registro
    # diário no Firestore para garantir que apenas a primeira envie o alerta.
    - cron: '20,35,50 10 * * 1-5'
  workflow_dispatch:

jobs:
  enviar-notificacoes:
    name: Enviar Push de Inspeções Pendentes
    runs-on: ubuntu-latest
    concurrency:
      group: notificacoes-diarias
      cancel-in-progress: false
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install firebase-admin
      - name: Executar script de notificações
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/enviar-notificacoes.js
